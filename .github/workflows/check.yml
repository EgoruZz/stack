name: stack check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest   # the stack is macOS-only (brew casks, /Applications paths)
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every script
        run: |
          status=0
          for f in scripts/*.sh; do bash -n "$f" || status=1; done
          exit $status
      - name: Doc consistency
        run: bash scripts/check-docs.sh
