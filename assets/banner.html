<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1500px; height:500px; overflow:hidden; position:relative;
    background: linear-gradient(180deg,#ffffff 0%,#f6f8fa 60%,#eef2f6 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,'SF Pro Display',sans-serif; }
  .mark { display:flex; gap:14px; justify-content:center; margin-bottom:30px; }
  .block { width:56px; height:56px; border-radius:14px; box-shadow:0 10px 30px rgba(2,6,23,.12); }
  .b1 { background:#1F6FEB; transform:translateY(6px); }
  .b2 { background:#2EA043; transform:translateY(-2px); }
  .b3 { background:#EA4AAA; transform:translateY(6px); }
  h1 { text-align:center; font-size:150px; font-weight:800; letter-spacing:-1px;
    color:#1f2328; margin:0; }
  .bar { width:380px; height:5px; margin:22px auto 20px; border-radius:3px;
    background:linear-gradient(90deg,#1F6FEB,#2EA043,#EA4AAA); }
  .tag { text-align:center; font-size:25px; color:#656d76; letter-spacing:3.5px;
    text-transform:uppercase; }
  .tag b { color:#1F6FEB; font-weight:600; }
  .hair { position:absolute; width:100%; height:1px; background:linear-gradient(90deg,transparent,#d0d7de,transparent); }
  .h1 { top:14%; } .h2 { bottom:14%; }
</style></head>
<body>
  <div class="hair h1"></div><div class="hair h2"></div>
  <div class="wrap">
    <div class="mark"><div class="block b1"></div><div class="block b2"></div><div class="block b3"></div></div>
    <h1>Stack</h1>
    <div class="bar"></div>
    <div class="tag">personal <b>AI dev</b> environment · macOS</div>
  </div>
</body></html>
