<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1500px; height:500px; overflow:hidden; position:relative;
    background: linear-gradient(120deg,#312e81 0%,#4338ca 40%,#0e7490 100%);
    display:flex; align-items:center; font-family:"SF Mono",ui-monospace,Menlo,monospace; }
  .dots { position:absolute; top:16px; left:24px; }
  .dots span { display:inline-block; width:12px;height:12px;border-radius:50%; margin-right:8px; }
  .win { width:860px; margin-left:70px; background:#0f172a; border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.45); border:1px solid rgba(148,163,184,.25); overflow:hidden; }
  .bar { height:38px; background:#1e293b; display:flex; align-items:center; padding-left:16px; }
  .prompt { padding:26px 30px; font-size:26px; line-height:1.75; color:#94a3b8; }
  .u { color:#4ade80; } .p { color:#22d3ee; } .c { color:#c4b5fd; } .dim { color:#64748b; }
  .cur { display:inline-block; width:13px; height:26px; background:#4ade80; vertical-align:-4px;
    animation:none; }
  .side { margin-left:64px; color:#e0e7ff; position:relative; z-index:2; }
  h1 { font-family:-apple-system,"SF Pro Display",sans-serif; font-size:120px; font-weight:800;
    color:#ffffff; letter-spacing:1px; margin:0 0 10px; text-shadow:0 8px 40px rgba(0,0,0,.35); }
  .tag { font-size:24px; color:#c7d2fe; line-height:1.7; max-width:420px; }
  .tag b { color:#67e8f9; font-weight:600; }
  .chips { margin-top:22px; }
  .chip { display:inline-block; padding:7px 16px; margin:0 10px 10px 0; border-radius:999px;
    font-size:19px; border:1px solid rgba(199,210,254,.45); color:#e0e7ff; background:rgba(255,255,255,.07); }
</style></head>
<body>
  <div class="win">
    <div class="bar"><div class="dots">
      <span style="background:#f87171"></span><span style="background:#fbbf24"></span><span style="background:#34d399"></span>
    </div></div>
    <div class="prompt">
      <div><span class="u">you@project</span> <span class="dim">$</span> <span class="c">opencode</span></div>
      <div><span class="p">agent</span> <span class="dim">&gt;</span> ready — <span class="dim">10 mcp · 60 skills · 5 craft apps</span><span class="cur"></span></div>
    </div>
  </div>
  <div class="side">
    <h1>Stack</h1>
    <div class="tag">кастомизация сессии <b>OpenCode</b>:<br>инструменты, скиллы, документы —<br>только там, где подключён</div>
    <div class="chips">
      <span class="chip">setup.sh</span><span class="chip">update-all.sh</span><span class="chip">new-project.sh</span>
    </div>
  </div>
</body></html>
